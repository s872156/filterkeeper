<h1>💧 濾芯管家 FilterKeeper</h1>
<p class="sub">記錄濾水器濾芯更換日期、到期提醒的 Android App</p>

<h2>功能</h2>
<ul>
  <li>多地點管理濾水器，記錄每一道濾芯的安裝與更換日期</li>
  <li>到期前推播提醒更換</li>
  <li>自訂濾芯種類、建議更換週期</li>
  <li>濾芯庫存管理，低於最低庫存時提示補貨；更換時一鍵扣庫存</li>
  <li>可選擇備份到使用者自己的 Google 雲端硬碟，重新安裝後還原</li>
</ul>
